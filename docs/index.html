<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#F6EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2A2522" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>JARVIS 伴侣</title>
<style>
  :root { color-scheme: light dark; --bg:#F6EFE6; --fg:#3A2E25; --muted:#8A7563; --card:#FFF9F1; --line:#E9DCCB;
          --accent:#C96F17; --on-accent:#FFF9F1; --rec:#D9622B; --meter:#E08A2E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#2A2522; --fg:#F3E7DA; --muted:#BCA894; --card:#352E2A; --line:#4A403A;
          --accent:#F2A33A; --on-accent:#2A2522; --rec:#F07A45; --meter:#F2A33A; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; background:var(--bg); color:var(--fg);
         padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  h1 { font-size:22px; margin:4px 0 12px; }
  h2 { font-size:17px; margin:0 0 8px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; margin:0 0 14px; }
  .muted { color:var(--muted); font-size:14px; }
  button, label.button { appearance:none; border:0; border-radius:16px; padding:12px 16px; font-size:16px; font-weight:600;
         background:var(--accent); color:var(--on-accent); display:inline-block; margin:4px 6px 4px 0; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button.rec { background:var(--rec); color:#FFF9F1; }
  #record { display:block; width:96px; height:96px; border-radius:50%; margin:14px auto 8px; padding:0; font-size:15px; }
  #stop { display:block; margin:0 auto; }
  button:disabled { opacity:.45; }
  input[type=file] { display:none; }
  .prompt { font-size:28px; font-weight:700; margin:10px 0; }
  .items button { display:block; width:100%; text-align:left; background:transparent; color:var(--fg); border:1px solid var(--line); }
  .items button.active { border-color:var(--accent); border-width:2px; }
  meter { width:100%; height:14px; accent-color:var(--meter); }
  .error { color:var(--rec); font-weight:600; }
  ul { padding-left:18px; margin:6px 0; }
  video { width:100%; border-radius:10px; background:#000; }
</style>
</head>
<body>
<h1><img src="icon-192.png" alt="" width="32" height="32" style="vertical-align:-7px;border-radius:8px;margin-right:8px">Jarvis</h1>
<p class="muted">录音录像只保存在这台手机的内存里，不会上传；只有你用分享菜单导出时才会离开手机。本页从 GitHub Pages 加载，可离线使用；打开时手机会联系 GitHub 检查更新，点“加载任务”时会下载任务文件。</p>

<section id="task-section">
  <h2>录音任务</h2>
  <p id="task-status" class="muted">还没有任务。点下面的按钮加载 JARVIS 发布的任务（需要联网一次，任务带签名）。</p>
  <button id="task-latest">加载 JARVIS 的任务</button>
  <label class="button secondary" for="task-file">从“文件”导入</label>
  <input id="task-file" type="file" accept=".json,application/json">
  <div id="items" class="items"></div>
</section>

<section id="record-section" hidden>
  <h2>录音</h2>
  <div class="muted">请说：</div>
  <div id="prompt" class="prompt"></div>
  <div id="progress" class="muted"></div>
  <meter id="level" min="0" max="1" low="0.1" high="0.9" optimum="0.5" value="0"></meter>
  <div id="level-text" class="muted">音量峰值：—</div>
  <button id="record" class="rec">开始录音</button>
  <button id="stop" class="secondary" disabled>停止</button>
</section>

<section>
  <h2>录像（手动）</h2>
  <p class="muted">1280×720、30 帧，最长 60 秒。</p>
  <button id="video-front" class="secondary">前摄像头</button>
  <button id="video-back" class="secondary">后摄像头</button>
  <video id="preview" playsinline muted hidden></video>
  <button id="video-record" class="rec" hidden>开始录像</button>
  <button id="video-stop" class="secondary" hidden disabled>停止</button>
</section>

<section>
  <h2>待导出 <span id="count" class="muted"></span></h2>
  <ul id="pending"></ul>
  <button id="export" disabled>导出（分享 → 存储到“文件”）</button>
  <button id="clear" class="secondary" disabled>清空</button>
  <p class="muted">每个文件附带一个同名 .json 说明（SHA-256、时长、采样率），JARVIS 导入时据此核对。</p>
</section>

<p id="error" class="error" role="alert"></p>
<p class="muted">版本 <span id="version"></span></p>
<script type="module" src="app.js"></script>
</body>
</html>
